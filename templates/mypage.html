<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <header class="main-header">
            <h1><i class="fa-solid fa-user-circle"></i> 마이페이지</h1>
            <p>{{ current_user.username }}님의 개인화된 공간입니다.</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm feature-card">
                    <div class="card-body d-flex flex-column align-items-center text-center">
                        <div class="feature-icon bg-primary text-white mb-3">
                            <i class="fa-solid fa-weight-scale fa-2x"></i>
                        </div>
                        <h5 class="card-title">비만도 체크</h5>
                        <p class="card-text text-muted">간단한 정보 입력으로 반려동물의 비만도를 확인하고 관리 가이드를 받아보세요.</p>
                        <a href="{{ url_for('obesity_check') }}" class="btn btn-primary mt-auto">바로가기 <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card h-100 shadow-sm feature-card">
                    <div class="card-body d-flex flex-column align-items-center text-center">
                        <div class="feature-icon bg-success text-white mb-3">
                            <i class="fa-solid fa-robot fa-2x"></i>
                        </div>
                        <h5 class="card-title">다이어트 플랜 챗봇</h5>
                        <p class="card-text text-muted">AI 영양사와 대화하며 반려동물에게 꼭 맞는 다이어트 계획을 세워보세요.</p> 
                        <a href="{{ url_for('chatbot') }}" class="btn btn-success mt-auto">시작하기 <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">메인으로 돌아가기</a>
        </div>

        <footer class="text-center text-muted py-4 mt-4">
            <small>&copy; 2024 Pet.AI</small>
        </footer>
    </div>
</body>
</html>
