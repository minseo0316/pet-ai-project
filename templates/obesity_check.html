<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비만도 체크</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <header class="main-header">
            <h1><i class="fa-solid fa-weight-scale"></i> 비만도 체크</h1>
        </header>

        <div class="card">
            <div class="card-header">반려동물 정보 입력</div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="pet_type">반려동물 종류</label>
                            <select class="form-select" id="pet_type" name="pet_type">
                                <option value="고양이" {% if pet_type == '고양이' %}selected{% endif %}>고양이</option>
                                <option value="강아지" {% if pet_type == '강아지' %}selected{% endif %}>강아지</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="age">나이 (세)</label>
                            <input type="number" class="form-control" id="age" name="age" step="0.1" value="{{ age or '2.0' }}" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="weight">체중 (kg)</label>
                            <input type="number" class="form-control" id="weight" name="weight" step="0.1" value="{{ weight or '4.5' }}" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">결과 확인하기</button>
                </form>
            </div>
        </div>

        {% if result %}
        <div class="card mt-4">
            <div class="card-header">체크 결과</div>
            <div class="card-body">
                {% if result.status == '평가 가이드' %}
                    <div style="white-space: pre-wrap;">{{ result.message }}</div>
                {% elif result.assessable %}
                    <h4>
                        <span class="badge 
                            {% if result.status == '정상' %}bg-success
                            {% elif result.status == '과체중' %}bg-warning
                            {% else %}bg-danger
                            {% endif %}">
                            {{ result.status }}
                        </span>
                    </h4>
                    <p>{{ result.message }}</p>
                {% else %}
                     <p>{{ result.message }}</p>
                {% endif %}
            </div>
        </div>
        {% endif %}

        <div class="text-center mt-4">
            <a href="{{ url_for('mypage') }}" class="btn btn-outline-secondary">마이페이지로 돌아가기</a>
        </div>
    </div>
</body>
</html>
