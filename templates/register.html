<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="card auth-card shadow-sm">
        <div class="card-body">
            <div class="text-center mb-4">
                 <a href="{{ url_for('index') }}" class="text-decoration-none text-dark">
                    <h2 class="fw-bold">🐾 Pet.AI</h2>
                </a>
                <p class="text-muted">가입하여 맞춤 분석 서비스를 이용해보세요.</p>
            </div>
        <form method="POST">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="사용자 이름" required>
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">가입하기</button>
        </form>
        <p class="text-center small mt-4">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
        </div>
    </div>
</body>
</html>
