<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>사용자 관리</h1>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">메인으로 돌아가기</a>
        </div>
        
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">사용자 이름</th>
                    <th scope="col">관리자 여부</th>
                    <th scope="col">작업</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <th scope="row">{{ user.id }}</th>
                    <td>{{ user.username }}</td>
                    <td>
                        {% if user.is_admin %}
                            <span class="badge bg-success">예</span>
                        {% else %}
                            <span class="badge bg-danger">아니오</span>
                        {% endif %}
                    </td>
                    <td>
                        {% if not user.is_admin %}
                        <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('정말로 이 사용자를 삭제하시겠습니까? 모든 분석 기록도 함께 삭제됩니다.');">
                            <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                        </form>
                        {% else %}
                        -
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
